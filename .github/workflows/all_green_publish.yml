---
name: Publish Ansible Collection
permissions:
  contents: read
  checks: write

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event.pull_request.number || github.sha
    }}
  cancel-in-progress: true

on: # yamllint disable-line rule:truthy
  # Allows manual triggering
  workflow_dispatch:
  # Run CI against all pushes (direct commits, also merged PRs), Pull Requests
  push:
    branches:
      - main
      - stable-*
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - main
      - stable-*
    tags:
      - "*"
  # Schedule run (once daily)
  schedule:
    ## Daily Docker Image Rebuild (10:29am daily)
    - cron: '29 10 * * *'

jobs:
  extract-metadata:
    name: Extract Galaxy Metadata
    runs-on: ubuntu-latest
    outputs:
      namespace: ${{ steps.meta.outputs.namespace }}
      name: ${{ steps.meta.outputs.name }}
      version: ${{ steps.meta.outputs.version }}
      collection_path: ${{ steps.meta.outputs.collection_path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install yq
        run: pip install yq

      - name: Parse galaxy.yml
        id: meta
        run: |
          # Strip surrounding quotes from yq output using tr or xargs
          NAMESPACE=$(yq '.namespace' galaxy.yml | tr -d '"')
          NAME=$(yq '.name' galaxy.yml | tr -d '"')
          VERSION=$(yq '.version' galaxy.yml | tr -d '"')

          echo "namespace=$NAMESPACE" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "collection_path=ansible_collections/$NAMESPACE/$NAME" >> $GITHUB_OUTPUT

  lint:
    uses: ./.github/workflows/ansible-lint.yml
    permissions:
      contents: read
      checks: write
      pull-requests: read
      issues: write

  sanity:
    needs: [ extract-metadata ]
    uses: ./.github/workflows/ansible-test-sanity.yml
    with:
      collection_path: ${{ needs.extract-metadata.outputs.collection_path }}

  units:
    needs: [ extract-metadata ]
    uses: ./.github/workflows/ansible-test-units.yml
    with:
      collection_path: ${{ needs.extract-metadata.outputs.collection_path }}

  publish:
    needs:
      - extract-metadata
      - lint
      - sanity
      - units
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release-collection.yml
    with:
      lint_result: ${{ needs.lint.result }}
      sanity_result: ${{ needs.sanity.result }}
      units_result: ${{ needs.units.result }}
      namespace: ${{ needs.extract-metadata.outputs.namespace }}
      collection_name: ${{ needs.extract-metadata.outputs.name }}
      collection_version: ${{ needs.extract-metadata.outputs.version }}
    permissions:
      contents: write
      checks: write
    secrets:
      ANSIBLE_GALAXY_API_KEY: ${{ secrets.ANSIBLE_GALAXY_API_KEY }}
