app:
  name: "dettonville-utils"
  max_inflight_components: 8
environment:
  db_path: ".cocoindex_storage/local.db"
sources:
  - type: local_files
    path: .
    include:
      - '**/*.py'
      - '**/*.md'
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.json'
      - '**/*.groovy'
      - '**/*.sh'
      - '**/*.tf'
    exclude:
      - '.git/**'
      - 'archive/**'
      - '__pycache__/**'
      - '*.pyc'
      - 'venv/**'
      - '.venv/**'
      - 'node_modules/**'
      - 'build/**'
      - 'dist/**'
      - '.pytest_cache/**'
      - '.coverage'
      - '*.log'
indexing:
  - type: embedding
    model: text-embedding-ada-002
    field: content
storage:
  type: postgres
